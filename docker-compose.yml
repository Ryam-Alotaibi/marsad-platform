services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # هذا الدور Superuser داخل الحاوية (initdb) — يُستخدم فقط للترحيلات/الزرع
      # (MIGRATOR_DATABASE_URL أدناه). دور التطبيق الفعلي المحدود الصلاحية
      # (marsad_app) يُنشَأ عبر infra/postgres-init عند أول تشغيل — راجع ذلك
      # الملف لسبب ضرورة هذا الفصل (RLS لا قيمة له إن كان دور التطبيق Superuser).
      POSTGRES_USER: ${POSTGRES_USER:-marsad}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-marsad_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-marsad}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - marsad_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marsad}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ml:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://marsad_app:${APP_DB_PASSWORD:-marsad_app_dev_password}@postgres:5432/${POSTGRES_DB:-marsad}
      MIGRATOR_DATABASE_URL: postgresql://${POSTGRES_USER:-marsad}:${POSTGRES_PASSWORD:-marsad_dev_password}@postgres:5432/${POSTGRES_DB:-marsad}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_me_access_secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_refresh_secret}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      PORT: ${API_PORT:-4000}
      ML_SERVICE_URL: http://ml:8000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      # اختياري — راجع .env.example، يبقى النظام على المزوّد التجريبي (Mock) بدونها
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "${API_PORT:-4000}:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "3000:3000"

  ml:
    build:
      context: ./apps/ml
    restart: unless-stopped
    ports:
      - "${ML_PORT:-8000}:8000"

volumes:
  marsad_postgres_data:
